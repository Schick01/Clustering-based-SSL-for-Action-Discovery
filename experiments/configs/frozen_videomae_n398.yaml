# Metodo a backbone congelato su VideoMAE, sottoinsieme originale
# (398 video, materializzato da src.datasets.materialize_subsets).
# Scala a cui il metodo completo NON si innescava (+0,7).
run_name: frozen_videomae_n398
backbone: videomae
data_path: data/subsets/n398
features_path: experiments/features/videomae_n398.pt # cache un-tantum delle feature congelate

num_clusters: 10          # K fissato al numero di classi del sottoinsieme (assunzione dichiarata)
projection_dim: 256       # dimensione dello spazio di proiezione su cui si clusterizza
max_iterations: 15
stability_threshold: 0.95 # NMI tra assegnazioni consecutive oltre cui fermarsi
min_cluster_size: 5       # sotto questa dimensione un cluster genera un warning

epochs: 1
extract_batch_size: 8     # batch di clip per l'estrazione un-tantum
batch_size: 32            # batch di vettori; regime calibrato con la loss-spia (13 update/iter a 398)
lr_projection: 1.0e-3
lr_head: 1.0e-3
weight_decay: 1.0e-4

seed: 42
device: cpu
