# Ablation "gentile" del clustering iterativo su ResNet18: passi di
# fine-tuning più piccoli (1 epoca, lr del backbone ridotto di 10x) per
# verificare se il mancato miglioramento del run standard dipende
# dall'aggressività degli iperparametri o da un limite strutturale
# delle feature di partenza.
run_name: iterative_resnet_gentle
backbone: resnet
data_path: data

num_clusters: 10          # K fissato al numero di classi del sottoinsieme (assunzione dichiarata)
max_iterations: 10
stability_threshold: 0.95 # NMI tra assegnazioni consecutive oltre cui fermarsi
min_cluster_size: 5       # sotto questa dimensione un cluster genera un warning

epochs: 1                 # standard: 2
batch_size: 4
lr_backbone: 1.0e-5       # standard: 1.0e-4
lr_head: 1.0e-3
weight_decay: 1.0e-4

seed: 42
device: cpu
